name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare project
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          cp icon.png assets/icon-background.png
          cp splash.png assets/splash.png
          cp splash.png assets/splash-dark.png
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install --save-dev @capacitor/assets
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.aether.tactics","appName":"Aether Tactics","webDir":"www","backgroundColor":"#07080d"}
          JSON
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#07080d' --splashBackgroundColor '#07080d' || echo "assets skipped"

      - name: Landscape + fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' $M
          sed -i 's#</style>#<item name="android:windowFullscreen">true</item></style>#g' android/app/src/main/res/values/styles.xml
          grep -n "screenOrientation" $M

      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-tactics-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
