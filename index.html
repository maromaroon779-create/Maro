'use strict';
/* ================= DATA ================= */
const EL={fire:{n:'ไฟ',c:'#c9583a',i:'🔥'},water:{n:'น้ำ',c:'#4a84b8',i:'💧'},wind:{n:'ลม',c:'#5a9a6e',i:'🍃'},light:{n:'แสง',c:'#d4ae56',i:'✨'},dark:{n:'มืด',c:'#8466b4',i:'🌑'}};
const starCol=o=>o&&o.aw?'#c77dff':'#ffd23f';
const SCOL={1:'#8a93a6',2:'#6f93c8',3:'#5fa8a0',4:'#a883d0',5:'#d9a840',6:'#d0607c'};
function rcls(st){return st>=5?'SSR':st===4?'SR':'R'}
function elMult(a,d){
  if((a==='fire'&&d==='wind')||(a==='wind'&&d==='water')||(a==='water'&&d==='fire'))return 1.3;
  if((a==='wind'&&d==='fire')||(a==='water'&&d==='wind')||(a==='fire'&&d==='water'))return 0.75;
  if((a==='light'&&d==='dark')||(a==='dark'&&d==='light'))return 1.3;
  return 1;
}
/* ================= ROSTER (ชุดใหม่) =================
   10 รูปร่าง (TPL) x ธาตุ · 1-2★ มี 3 ธาตุ (ไฟ/น้ำ/ลม) · 3-5★ มีครบ 5 ธาตุ
   รูปร่างเหมือนกันในทุกธาตุ แต่ สี/ชื่อ/สกิล/เอฟเฟกต์/สายต่อสู้ ต่างกัน */
/* ===== ระบบดาวแบบ Summoners War: 1 ครอบครัว = 1 สปีชีส์, แต่ต่างธาตุต่างดาวได้ +-1 ===== */
const TPL={
 A1:{base:1,acc:'dagger',hat:'headband'},
 A2:{base:1,acc:'wand',hat:'flower'},
 B1:{base:2,acc:'staff',hat:'witch'},
 B2:{base:2,acc:'shield',hat:'ribbon'},
 C1:{base:3,acc:'sword',hat:'helm'},C2:{base:3,acc:'bow',hat:'feather'},
 D1:{base:4,acc:'hammer',hat:'horns'},D2:{base:4,acc:'lantern',hat:'halo'},
 E1:{base:5,acc:'greatsword',hat:'crown'},E2:{base:5,acc:'book',hat:'hood'},
F1:{base:1,acc:'dagger',hat:'cap'},
 F2:{base:1,acc:'wand',hat:'leaf'},
 G1:{base:2,acc:'axe',hat:'band'},
 G2:{base:2,acc:'bow',hat:'hood'},
 H1:{base:3,acc:'spear',hat:'crown'},
 H2:{base:3,acc:'scythe',hat:'horns'},
 I1:{base:4,acc:'hammer',hat:'helm'},
 I2:{base:4,acc:'orb',hat:'halo'},
 J1:{base:5,acc:'greatsword',hat:'dragon'},
 J2:{base:5,acc:'staff',hat:'witch'},
};
/* ===== ดาวธรรมชาติ (Natural Stars) แบบ Summoners War =====

function dgWaves(el,f){
  const P=DGX[el].pool,a=P.a;
  const w1=`${a[0]}*${2+(f>=2?1:0)} ${a[1]}*1`;
  const w2=`${a[1]}*2 ${a[2]}*${f>=3?2:1}`+(f>=2?` ${a[3]}*1`:'');
  let w3;
  if(f===0)w3=`${a[2]}*2 ${a[0]}*1`;
  else if(f<3)w3=`${P.m}*1 ${a[0]}*2`;
  else if(f===3)w3=`${P.m}*2 ${a[2]}*1`;
  else w3=`${P.b}*1 ${a[2]}*1 ${a[3]}*1`;
  return [w1,w2,w3];
}

function dragSlot(el,i,els){
  el.style.touchAction='none';let sx=null,sy=0,on=false,pid=0;
  const sc=()=>{const w=$('wrap');return w.getBoundingClientRect().width/w.offsetWidth||1};
  el.addEventListener('click',e=>{if(el._dg){e.stopImmediatePropagation();e.preventDefault();el._dg=false}},true);
  el.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;on=false;pid=e.pointerId;el._dg=false});
  el.addEventListener('pointermove',e=>{
    if(sx==null||e.pointerId!==pid)return;const dx=e.clientX-sx,dy=e.clientY-sy;

}

function pickHero(sc,star){
  // แบบ Summoners War: สุ่มธาตุ -> สุ่มฮีโร่ "ที่มีดาวธรรมชาติเท่ากับดาวที่ออก" (ดาวไม่ได้ถูกกำหนดให้ฮีโร่ตามใจ)
  const el=sc.els[Math.floor(Math.random()*sc.els.length)];
  let pool=(POOLS[el]||{})[star];
  if(!pool||!pool.length){ // ธาตุนั้นไม่มีฮีโร่ดาวนี้ -> ใช้ดาวใกล้เคียงที่สุดในธาตุเดียวกัน
    const ks=Object.keys(POOLS[el]).map(Number).sort((a,b)=>Math.abs(a-star)-Math.abs(b-star)||a-b);
    pool=POOLS[el][ks[0]];
  }
  const id=pool[Math.floor(Math.random()*pool.length)];return {id,star:CH[id].natStar};
}
function rollStar(sc){let r=Math.random()*100,acc=0;for(const [st,w] of sc.rates){acc+=w;if(r<acc)return st}return sc.rates[sc.rates.length-1][0]}
function doPull(k,n){
  const sc=SCROLLS[k];
  if((S.scr[k]||0)<n){toast('คัมภีร์ไม่พอ — ซื้อได้ที่ร้านค้า หรือหาจากด่านและดันเจี้ยน');return}
  S.scr[k]-=n;dailyAdd('gacha1');pfS();S.stat.pulls+=n;sfx('gacha');const res=[];
  for(let i=0;i<n;i++){
    let star=rollStar(sc);
    if(n===10&&i===9&&sc.g10&&star<sc.g10&&!res.some(r=>r.star>=sc.g10))star=sc.g10;
    {const pt=PITY[k];if(pt){S.pt=S.pt||{};S.pt[k]=(S.pt[k]||0)+1;if(S.pt[k]>=pt.n&&star<pt.star)star=pt.star;if(star>=pt.star)S.pt[k]=0}}
    star=Math.min(5,star);                       // สุ่มได้สูงสุด 5★ (6★ ได้จากการอัปเท่านั้น)
    const pk=pickHero(sc,star),id=pk.id;star=pk.star;
    const o=S.owned[id];let tag='';
    if(!o){S.owned[id]={n:1,lv:1,star:CH[id].natStar,sh:0,aw:0,xp:0};tag='NEW'}
    else{o.n=(o.n||1)+1;
      const g=SHARD_GAIN[CH[id].natStar];o.sh=(o.sh||0)+g;tag='+'+g+' ชิ้นส่วน';
      if(CH[id].low){S.fod[id]=(S.fod[id]||0)+1;tag+=' · +1 🧪'}}
    res.push({id,star,tag});
  }
  save();refreshRes();
  const h=`<div style="font-size:16px;margin-bottom:6px">${sc.ic} ${sc.n}</div><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:820px;padding:0 10px" id="pres"></div><button class="btn" id="pOk">ตกลง</button>`;

  }));
}

/* ================= MONSTER ART — procedural + animated =================
   ทุกตัววาดด้วยโค้ด (ไม่ใช้อีโมจิ) ต้นเท้าอยู่ที่ (0,0) สูงประมาณ 80 หน่วย
   fn(c, t, ph, act, u)  t=เวลา ph=เฟสสุ่มต่อตัว act=0..1 (ท่าพุ่งโจมตี) u=ยูนิต */
const MA={};
const MLN='#150c18';
function mgrad(c,x0,y0,x1,y1,a,b){const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function mblink(t,ph){return ((t*.5+ph*.7)%3.4)>3.28?.12:1}
function limb(c,x1,y1,x2,y2,w,col,ln){c.lineCap='round';c.lineJoin='round';c.strokeStyle=ln||MLN;c.lineWidth=w+3;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.strokeStyle=col;c.lineWidth=w;c.stroke()}
function limb2(c,x1,y1,x2,y2,x3,y3,w,col,ln){c.lineCap='round';c.lineJoin='round';[[ln||MLN,w+3],[col,w]].forEach(([cc,ww])=>{c.strokeStyle=cc;c.lineWidth=ww;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineTo(x3,y3);c.stroke()})}
function meye(c,x,y,r,bl,col,pc){c.fillStyle=col||'#fff';c.beginPath();c.ellipse(x,y,r,Math.max(.7,r*1.1*bl),0,0,7);c.fill();if(bl>.5){c.fillStyle=pc||'#201020';c.beginPath();c.arc(x+r*.12,y+r*.1,r*.58,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x-r*.12,y-r*.25,r*.24,0,7);c.fill()}}
function geye(c,x,y,r,bl,col){glowC(c,x,y,r*2.8,col,.55);c.fillStyle=col;c.beginPath();c.ellipse(x,y,r,Math.max(.7,r*bl),0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.ellipse(x,y,r*.45,Math.max(.5,r*.5*bl),0,0,7);c.fill()}
function mshade(c,x,y,rx,ry,col,col2){c.fillStyle=mgrad(c,0,y-ry,0,y+ry,col,col2);c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill();c.strokeStyle=MLN;c.lineWidth=2;c.stroke()}
function leafBlob(c,x,y,r,col,col2){c.fillStyle=mgrad(c,0,y-r,0,y+r,col,col2);c.beginPath();c.arc(x,y,r,0,7);c.fill();c.strokeStyle=MLN;c.lineWidth=2;c.stroke();c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.ellipse(x-r*.3,y-r*.4,r*.4,r*.22,-.5,0,7);c.fill()}
function drawMonster(c,u,t){
  const fn=MA[u.id];if(!fn)return false;
  const act=Math.min(1,Math.hypot(u.ox,u.oy)/45);
  c.save();fn(c,t,u.ph,act,u);c.restore();return true;
}

/* ---------- weapons ---------- */
const wClub=c=>{c.fillStyle='#6a4420';c.beginPath();c.moveTo(-2.5,6);c.lineTo(2.5,6);c.lineTo(4,-24);c.lineTo(9,-32);c.lineTo(8,-46);c.lineTo(-8,-46);c.lineTo(-9,-32);c.lineTo(-4,-24);c.closePath();c.fill();c.strokeStyle=MLN;c.lineWidth=2;c.stroke();c.fillStyle='#cfc8a8';[[-6,-38],[6,-38],[0,-44],[-5,-30],[5,-30]].forEach(p=>{c.beginPath();c.moveTo(p[0]-2,p[1]+2);c.lineTo(p[0],p[1]-4);c.lineTo(p[0]+2,p[1]+2);c.closePath();c.fill()})};
const wAxe=c=>{c.fillStyle='#5a3a1a';c.fillRect(-2.5,-48,5,56);c.strokeStyle=MLN;c.lineWidth=2;c.strokeRect(-2.5,-48,5,56);c.fillStyle=mgrad(c,-4,0,24,0,'#d8dde6','#6a7280');c.beginPath();c.moveTo(2,-46);c.quadraticCurveTo(28,-54,26,-30);c.quadraticCurveTo(14,-34,2,-26);c.closePath();c.fill();c.stroke();c.fillStyle='#8a6a2a';c.beginPath();c.arc(0,-50,3.5,0,7);c.fill()};

const wScim=c=>{c.fillStyle='#6a4a1a';c.fillRect(-2,2,4,10);c.fillStyle='#e8c050';c.fillRect(-8,-1,16,4);c.fillStyle=mgrad(c,-5,0,6,0,'#f4f6fa','#8a92a0');c.beginPath();c.moveTo(-4,-1);c.quadraticCurveTo(-6,-30,6,-48);c.quadraticCurveTo(10,-28,5,-1);c.closePath();c.fill();c.strokeStyle=MLN;c.lineWidth=1.8;c.stroke()};
const wSword=(len,w,a,b,glow)=>(c,t)=>{if(glow)glowC(c,0,-len*.55,len*.6,glow,.35+.12*Math.sin(t*4));c.fillStyle='#4a3a2a';c.fillRect(-2,0,4,10);c.fillStyle='#b89848';c.fillRect(-w*1.3,-2,w*2.6,4);c.fillStyle=mgrad(c,-w,0,w,0,a,b);c.beginPath();c.moveTo(-w,-2);c.lineTo(-w,-len+8);c.lineTo(0,-len);c.lineTo(w,-len+8);c.lineTo(w,-2);c.closePath();c.fill();c.strokeStyle=MLN;c.lineWidth=1.8;c.stroke();c.fillStyle='rgba(255,255,255,.5)';c.fillRect(-1,-len+10,2,len-14)};
const wHammer=c=>{c.fillStyle='#5a4a3a';c.fillRect(-3,-52,6,62);c.strokeStyle=MLN;c.lineWidth=2;c.strokeRect(-3,-52,6,62);c.fillStyle=mgrad(c,0,-76,0,-48,'#b8a888','#6a5a44');rr(c,-17,-76,34,28,5);c.fill();c.stroke();c.fillStyle='#ffa030';c.fillRect(-9,-66,18,3)};
const wStaff=(col,top)=>(c,t,ph)=>{c.fillStyle='#6a4a2a';c.fillRect(-2,-62,4,76);c.strokeStyle=MLN;c.lineWidth=1.6;c.strokeRect(-2,-62,4,76);const p=1+Math.sin(t*4+ph)*.15;glowC(c,0,-68,22*p,col,.7);c.fillStyle='#fff';c.beginPath();c.arc(0,-68,5*p,0,7);c.fill();c.strokeStyle='#d8b050';c.lineWidth=2.5;c.beginPath();c.arc(0,-68,8,Math.PI*.9,Math.PI*2.1);c.stroke()};
const wShield=(col,em)=>c=>{c.fillStyle=mgrad(c,-14,-14,14,14,col,'#3a2a1a');c.beginPath();c.arc(-6,-4,17,0,7);c.fill();c.strokeStyle=MLN;c.lineWidth=2.2;c.stroke();c.strokeStyle='rgba(255,230,160,.7)';c.lineWidth=2;c.beginPath();c.arc(-6,-4,12,0,7);c.stroke();c.fillStyle=em;c.beginPath();c.arc(-6,-4,5,0,7);c.fill()};

/* ---------- face / skull ---------- */
function face(c,hr,o,bl,act,t,ph){
  const ln=o.line||MLN;
  if(o.ears)[-1,1].forEach(s=>{const fl=Math.sin(t*2.5+ph+s)*.08;c.save();c.rotate(s*fl);c.fillStyle=o.skin;c.beginPath();c.moveTo(s*hr*.8,-hr*.1);c.quadraticCurveTo(s*hr*1.7,-hr*.6,s*hr*2.15,-hr*1.05);c.quadraticCurveTo(s*hr*1.7,hr*.2,s*hr*.85,hr*.45);c.closePath();c.fill();c.strokeStyle=ln;c.lineWidth=2;c.stroke();c.restore()});
  c.fillStyle=o.skin;c.beginPath();c.ellipse(0,0,hr*1.05,hr,0,0,7);c.fill();c.strokeStyle=ln;c.lineWidth=2;c.stroke();
  const g=c.createRadialGradient(-hr*.3,-hr*.4,1,0,0,hr*1.2);g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(1,'rgba(0,0,0,.22)');c.fillStyle=g;c.fill();
  if(o.face){o.face(c,hr,bl,act,t,ph);return}
  const ey=-hr*.1,ex=hr*.42,er=hr*.27;
  [-1,1].forEach(s=>{if(o.eyeC)geye(c,s*ex,ey,er,bl,o.eyeC);else meye(c,s*ex,ey,er,bl,'#fff',o.pupil);
    if(o.angry!==0){c.strokeStyle=ln;c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(s*hr*.78,ey-er*1.55);c.lineTo(s*hr*.1,ey-er*.85);c.stroke()}});
  const mo=Math.max(act,Math.sin(t*1.2+ph)>.92?.45:0);
  if(mo>.15){c.fillStyle='#3a0a14';c.beginPath();c.ellipse(0,hr*.52,hr*.38,hr*.1+hr*.22*mo,0,0,7);c.fill();c.strokeStyle=ln;c.lineWidth=1.5;c.stroke()}
  else{c.strokeStyle=ln;c.lineWidth=2;c.beginPath();c.moveTo(-hr*.3,hr*.5);c.quadraticCurveTo(0,hr*.68,hr*.3,hr*.5);c.stroke()}
  if(o.fang){c.fillStyle='#fffbe8';[-1,1].forEach(s=>{c.beginPath();c.moveTo(s*hr*.26,hr*.46);c.lineTo(s*hr*.4,hr*.46);c.lineTo(s*hr*.33,hr*.74);c.closePath();c.fill()})}
}
function skull(c,hr,o,bl,act,t,ph){
  const ln='#15101e';c.fillStyle='#e8e4d0';c.beginPath();c.ellipse(0,-hr*.1,hr*.95,hr*.95,0,0,7);c.fill();c.strokeStyle=ln;c.lineWidth=2;c.stroke();
  const jaw=hr*.35+act*hr*.35+Math.max(0,Math.sin(t*1.7+ph))*hr*.06;
  c.fillStyle='#d8d4bc';rr(c,-hr*.55,hr*.5,hr*1.1,jaw,3);c.fill();c.stroke();
  c.fillStyle='#fffbe8';for(let i=-2;i<=2;i++)c.fillRect(i*hr*.2-hr*.07,hr*.5,hr*.14,Math.min(jaw,hr*.2));
  [-1,1].forEach(s=>{c.fillStyle='#0a0612';c.beginPath();c.ellipse(s*hr*.4,-hr*.15,hr*.3,hr*.34,0,0,7);c.fill();geye(c,s*hr*.4,-hr*.12,hr*.13,bl,o.eyeC||'#6ad8ff')});
  c.fillStyle='#0a0612';c.beginPath();c.moveTo(0,hr*.12);c.lineTo(-hr*.12,hr*.38);c.lineTo(hr*.12,hr*.38);c.closePath();c.fill();
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1.3;c.beginPath();c.moveTo(hr*.5,-hr*.85);c.lineTo(hr*.3,-hr*.5);c.lineTo(hr*.42,-hr*.3);c.stroke();
}

/* ---------- humanoid builder ---------- */
function hum(c,t,ph,act,o){
  const sw=Math.sin(t*3.2+ph),br=Math.sin(t*2.1+ph),bl=mblink(t,ph),ln=o.line||MLN;
  const tw=o.tw||24,th=o.th||28,hr=o.hr||14,lw=o.lw||7,aw=o.aw||6,bob=Math.abs(sw)*1.5;
  c.save();c.translate(0,-bob-(o.float?10+Math.sin(t*2+ph)*3:0));
  o.back&&o.back(c,t,ph,act);
  [-1,1].forEach(s=>{const f=sw*s*5-act*s*3,lx=s*tw*.28;limb(c,lx,-26,lx+f,-4,lw,o.leg,ln);c.fillStyle=o.boot||o.leg;c.beginPath();c.ellipse(lx+f+s*2,-3,lw*.85,3.4,0,0,7);c.fill()});
  c.save();c.translate(0,-26);c.scale(1+br*.012,1+br*.025);
  c.fillStyle=mgrad(c,0,-th,0,0,o.body,o.bodyD);rr(c,-tw/2,-th,tw,th,8);c.fill();c.strokeStyle=ln;c.lineWidth=2;c.stroke();
  const hl=c.createLinearGradient(-tw/2,0,tw/2,0);hl.addColorStop(0,'rgba(255,255,255,.18)');hl.addColorStop(.5,'rgba(255,255,255,0)');hl.addColorStop(1,'rgba(0,0,0,.2)');c.fillStyle=hl;rr(c,-tw/2,-th,tw,th,8);c.fill();
  o.torso&&o.torso(c,tw,th,t,ph,act);
  c.restore();
  const shy=-26-th+7,sx=tw/2-1;
  const hands=o.zombie?[[-sx-10,shy-3+sw*3-act*6],[sx+10,shy-3-sw*3-act*6]]:[[-sx-6,shy+16+sw*3-act*8],[sx+6+act*3,shy+14-sw*3-act*(o.wr?16:8)]];
  [-1,1].forEach((s,i)=>{const h=hands[i],ex=s*(sx+(o.zombie?5:3)),ey=(shy+h[1])/2+4;limb2(c,s*sx,shy,ex,ey,h[0],h[1],aw,o.arm||o.skin,ln);c.fillStyle=o.hand||o.skin;c.beginPath();c.arc(h[0],h[1],aw*.7,0,7);c.fill();c.strokeStyle=ln;c.lineWidth=1.6;c.stroke()});
  if(o.wl){c.save();c.translate(hands[0][0],hands[0][1]);c.rotate(Math.sin(t*2+ph)*.04);o.wl(c,t,ph,act);c.restore()}
  if(o.wr){c.save();c.translate(hands[1][0],hands[1][1]);c.rotate((o.wa==null?-.15:o.wa)+sw*.05+act*(o.wact==null?1.1:o.wact));o.wr(c,t,ph,act);c.restore();c.fillStyle=o.hand||o.skin;c.beginPath();c.arc(hands[1][0],hands[1][1],aw*.7,0,7);c.fill();c.strokeStyle=ln;c.lineWidth=1.6;c.stroke()}
  o.fx&&o.fx(c,t,ph,act,hands);
  c.save();c.translate(0,-26-th-hr+5);c.rotate(Math.sin(t*1.4+ph)*.05+act*.08);c.scale(1,1+br*.01);
  if(o.skull)skull(c,hr,o,bl,act,t,ph);else face(c,hr,o,bl,act,t,ph);
  o.hat&&o.hat(c,hr,t,ph,act);
  c.restore();c.restore();
}

/* ---------- floating robed caster builder ---------- */
function robed(c,t,ph,act,o){
  const fl=Math.sin(t*2+ph),sw=Math.sin(t*3+ph),bl=mblink(t,ph),ln=o.line||MLN;
  const w=o.rw||24,H=o.rh||50;
  c.save();c.translate(0,-18-fl*4);
  o.back&&o.back(c,t,ph,act);
  c.beginPath();c.moveTo(-w*.5,-H);c.quadraticCurveTo(-w*1.25,-H*.45,-w*1.1+sw*2,0);
  for(let i=0;i<=8;i++){const x=-w*1.1+i*(w*2.2/8)+sw*2*(1-i/8);c.lineTo(x,Math.sin(t*4+i*1.3+ph)*3+(i%2?4:0))}
  c.quadraticCurveTo(w*1.25,-H*.45,w*.5,-H);c.closePath();
  c.fillStyle=mgrad(c,0,-H,0,0,o.robe,o.robeD);c.fill();c.strokeStyle=ln;c.lineWidth=2;c.stroke();
  c.fillStyle=o.trim;c.globalAlpha=.9;c.beginPath();c.moveTo(-4,-H+4);c.lineTo(4,-H+4);c.lineTo(7+sw,-2);c.lineTo(-7+sw,-2);c.closePath();c.fill();c.globalAlpha=1;
  o.robeFx&&o.robeFx(c,w,H,t,ph);
  const sy=-H+9,lh=[-w-7+sw*2-act*4,-H*.5+fl*3-act*14],rh=[w+8-sw*2+act*4,-H*.52-fl*3-act*20];
  [[-1,lh],[1,rh]].forEach(([s,h])=>{limb2(c,s*w*.5,sy,s*(w+2),(sy+h[1])/2+5,h[0],h[1],8,o.robe,ln);c.fillStyle=o.skin;c.beginPath();c.arc(h[0],h[1],4.4,0,7);c.fill();c.strokeStyle=ln;c.lineWidth=1.5;c.stroke()});
  if(o.wl){c.save();c.translate(lh[0],lh[1]);o.wl(c,t,ph,act);c.restore()}
  if(o.wr){c.save();c.translate(rh[0],rh[1]);c.rotate(.05+sw*.03+act*.5);o.wr(c,t,ph,act);c.restore()}
  c.save();c.translate(0,-H-8);c.rotate(Math.sin(t*1.3+ph)*.05);
  o.head(c,t,ph,act,bl);
  c.restore();
  o.fg&&o.fg(c,t,ph,act);
  c.restore();
}
function hood(c,col,col2,r){c.fillStyle=mgrad(c,0,-r*1.4,0,r,col,col2);c.beginPath();c.moveTo(-r*1.05,r*.9);c.quadraticCurveTo(-r*1.3,-r*.6,0,-r*1.5);c.quadraticCurveTo(r*1.3,-r*.6,r*1.05,r*.9);c.quadraticCurveTo(0,r*.5,-r*1.05,r*.9);c.closePath();c.fill();c.strokeStyle=MLN;c.lineWidth=2;c.stroke()}
function wisps(c,t,ph,col,n,spread,hgt){for(let i=0;i<n;i++){const k=((t*.5+i/n+ph*.13)%1);c.globalAlpha=Math.sin(k*Math.PI)*.75;c.fillStyle=col;c.beginPath();c.arc(Math.sin(i*2.3+t*1.3)*spread*(.5+k*.5),-k*hgt,1.6+(1-k)*2.6,0,7);c.fill()}c.globalAlpha=1}

/* ================= FOREST ================= */
MA.slime=(c,t,ph,act)=>{
  const sq=Math.sin(t*3.6+ph),sx=1-sq*.09+act*.1,sy=1+sq*.1-act*.08,hop=Math.max(0,sq)*7,bl=mblink(t,ph);

function enRoll(){
  S.en=S.en||{v:EN_MAX,t:Date.now()};const now=Date.now();
  if(S.en.v>=EN_MAX){S.en.t=now;return S.en}
  const k=Math.floor((now-S.en.t)/EN_MS);if(k>0){S.en.v=Math.min(EN_MAX,S.en.v+k);S.en.t=S.en.v>=EN_MAX?now:S.en.t+k*EN_MS}
  return S.en;
}

const RSHAPE={
 1:'M50 4L96 50L50 96L4 50Z',
 2:'M16 8H84Q92 8 92 16V54Q92 70 50 94Q8 70 8 54V16Q8 8 16 8Z',
 3:'M50 5L95 86Q97 94 89 94H11Q3 94 5 86Z',

function runeHex(r,size,slot,sel){
  const sl=r?r.slot:(slot||1),D=RSHAPE[sl]||RSHAPE[1],id='rg'+(++rnUid);
  if(!r)return `<div class="rnh empty ${sel?'sel':''}" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"><path class="rfr" d="${D}" fill="#6a5a3a"/><path d="${D}" transform="translate(50 50) scale(.86) translate(-50 -50)" fill="#150f22"/></svg><span class="rno" style="font-size:${size*.42}px">${sl}</span></div>`;
  const st=RSET[r.set],big=size>=44;
  return `<div class="rnh ${sel?'sel':''}" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${st.c}"/><stop offset="1" stop-color="#1a1530"/></linearGradient></defs><path class="rfr" d="${D}" fill="${SCOL[r.star]}"/><path d="${D}" transform="translate(50 50) scale(.86) translate(-50 -50)" fill="url(#${id})"/></svg>
   <i class="rsy" style="font-size:${size*.4}px">${st.ic}</i>${big?`<span class="rst" style="font-size:${Math.max(7,size*.13)}px;color:${SCOL[r.star]}">${'★'.repeat(r.star)}</span><span class="rsn" style="font-size:${Math.max(8,size*.15)}px">${sl}</span>`:''}<b class="rlv" style="font-size:${Math.max(8,size*.19)}px">+${r.lv}</b></div>`;
}
function runeEff(r){if(!r.s.length)return 0;return Math.round(100*r.s.reduce((a,[k,v])=>a+v/(RSTAT[k].sub*STARR[r.star]),0)/r.s.length)}

    $('rmUp').onclick=()=>{if(r.lv<RLV&&S.coins>=cost){S.coins-=cost;r.lv++;beep(760,.15,'triangle');toast('อัปรูนเป็น +'+r.lv);done();runeModal(rid,hid)}};

    $('rmX').onclick=closeModal;
  });
}
